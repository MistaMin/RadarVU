<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="800" viewBox="0 0 1500 800" font-family="Avenir Next, Helvetica Neue, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07090c"/>
      <stop offset="1" stop-color="#0d1116"/>
    </linearGradient>
    <radialGradient id="scopeFace" cx="50%" cy="46%" r="58%">
      <stop offset="0" stop-color="#05080b"/>
      <stop offset="0.72" stop-color="#070c11"/>
      <stop offset="1" stop-color="#0a1218"/>
    </radialGradient>
    <linearGradient id="chipOn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#45e0ff"/>
      <stop offset="1" stop-color="#1d7d9a"/>
    </linearGradient>
    <linearGradient id="chipOff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14191f"/>
      <stop offset="1" stop-color="#11161b"/>
    </linearGradient>
    <linearGradient id="cell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10161b"/>
      <stop offset="1" stop-color="#0e1318"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1500" height="800" fill="url(#bg)"/>

  <!-- Title -->
  <text x="24" y="42" fill="#e8eef2" font-size="30" font-weight="700" letter-spacing="1">RadarVU</text>
  <text x="168" y="44" fill="#45e0ff" font-size="15" letter-spacing="2">LUFS RADAR · CONCEPT SKETCH</text>
  <text x="24" y="66" fill="#7d878e" font-size="13">A BS.1770-5 loudness meter with a plan-position-indicator sweep. The audio passes through unchanged.</text>

  <!-- ============================ GUI MOCKUP (1100 x 560) ============================ -->
  <g transform="translate(24,90)">
    <rect width="1100" height="560" rx="14" fill="#0a0d11" stroke="#2a353e" stroke-width="1" filter="url(#shadow)"/>

    <!-- Header -->
    <rect x="0" y="0" width="1100" height="44" rx="14" fill="#0a0d11"/>
    <rect x="0" y="30" width="1100" height="14" fill="#0a0d11"/>
    <line x1="0" y1="43.5" x2="1100" y2="43.5" stroke="#2a353e" stroke-width="1"/>
    <text x="24" y="30" fill="#e8eef2" font-size="20" font-weight="700" letter-spacing="1">RADARVU</text>
    <text x="26" y="41" fill="#7d878e" font-size="10" letter-spacing="1">LUFS RADAR</text>

    <g font-size="11" text-anchor="middle">
      <rect x="200" y="10" width="150" height="26" rx="13" fill="url(#chipOff)" stroke="#2a353e"/>
      <text x="275" y="27" fill="#7d878e">TARGET −14 LUFS</text>
      <rect x="360" y="10" width="152" height="26" rx="13" fill="url(#chipOff)" stroke="#2a353e"/>
      <text x="436" y="27" fill="#7d878e">CEILING −1 dBTP</text>
      <rect x="522" y="10" width="128" height="26" rx="13" fill="url(#chipOff)" stroke="#2a353e"/>
      <text x="586" y="27" fill="#7d878e">SWEEP 10 s</text>
      <rect x="778" y="10" width="96" height="26" rx="13" fill="url(#chipOff)" stroke="#2a353e"/>
      <text x="826" y="27" fill="#7d878e">↺ RESET</text>
      <rect x="882" y="10" width="88" height="26" rx="13" fill="url(#chipOn)" stroke="#9feaff"/>
      <text x="926" y="27" fill="#041016" font-weight="700">RADAR</text>
      <rect x="978" y="10" width="88" height="26" rx="13" fill="url(#chipOff)" stroke="#2a353e"/>
      <text x="1022" y="27" fill="#7d878e">BAR</text>
    </g>

    <!-- Radar scope -->
    <g>
      <!-- bezel + face -->
      <circle cx="370" cy="268" r="226" fill="#10161b" stroke="#2a353e" stroke-width="1.5"/>
      <circle cx="370" cy="268" r="216" fill="url(#scopeFace)" stroke="#45e0ff" stroke-opacity="0.35"/>

      <!-- LUFS grid rings -->
      <g fill="none" stroke="#1b252d" stroke-width="1">
        <circle cx="370" cy="268" r="216"/>
        <circle cx="370" cy="268" r="162"/>
        <circle cx="370" cy="268" r="108"/>
        <circle cx="370" cy="268" r="54"/>
      </g>

      <!-- crosshair -->
      <g stroke="#1b252d" stroke-width="1">
        <line x1="154" y1="268" x2="586" y2="268"/>
        <line x1="370" y1="52" x2="370" y2="484"/>
      </g>

      <!-- diagonal half-spokes -->
      <g stroke="#1b252d" stroke-width="1">
        <line x1="446.4" y1="191.4" x2="522.7" y2="115.3"/>
        <line x1="293.6" y1="191.4" x2="217.3" y2="115.3"/>
        <line x1="446.4" y1="344.6" x2="522.7" y2="420.7"/>
        <line x1="293.6" y1="344.6" x2="217.3" y2="420.7"/>
      </g>

      <!-- outer ticks every 30 degrees -->
      <g stroke="#465058" stroke-width="1">
        <line x1="370" y1="52" x2="370" y2="58" transform="rotate(0,370,268)"/>
        <line x1="370" y1="52" x2="370" y2="58" transform="rotate(30,370,268)"/>
        <line x1="370" y1="52" x2="370" y2="58" transform="rotate(60,370,268)"/>
        <line x1="370" y1="52" x2="370" y2="58" transform="rotate(90,370,268)"/>
        <line x1="370" y1="52" x2="370" y2="58" transform="rotate(120,370,268)"/>
        <line x1="370" y1="52" x2="370" y2="58" transform="rotate(150,370,268)"/>
        <line x1="370" y1="52" x2="370" y2="58" transform="rotate(180,370,268)"/>
        <line x1="370" y1="52" x2="370" y2="58" transform="rotate(210,370,268)"/>
        <line x1="370" y1="52" x2="370" y2="58" transform="rotate(240,370,268)"/>
        <line x1="370" y1="52" x2="370" y2="58" transform="rotate(270,370,268)"/>
        <line x1="370" y1="52" x2="370" y2="58" transform="rotate(300,370,268)"/>
        <line x1="370" y1="52" x2="370" y2="58" transform="rotate(330,370,268)"/>
      </g>

      <!-- ring labels -->
      <g fill="#7d878e" font-size="9">
        <text x="376" y="63">0</text>
        <text x="376" y="112">−15</text>
        <text x="376" y="166">−30</text>
        <text x="376" y="220">−45</text>
      </g>

      <!-- target ring (dashed, green) -->
      <circle cx="370" cy="268" r="165.6" fill="none" stroke="#46e16e" stroke-opacity="0.9" stroke-width="1.5" stroke-dasharray="6 6"/>

      <!-- phosphor trail (spiral, fading glow) -->
      <polyline fill="none" stroke="#45e0ff" stroke-opacity="0.85" stroke-width="3"
        points="416.4,147.0 363.8,149.4 313.1,156.4 264.2,182.4 244.8,234.5 229.2,290.3 237.8,353.9 287.7,394.8 347.0,413.1 411.9,424.5 481.5,405.6 520.1,344.5 525.3,276.1 523.3,209.2 492.2,145.8" filter="url(#glowSoft)"/>
      <polyline fill="none" stroke="#aef3ff" stroke-opacity="0.9" stroke-width="1.2"
        points="416.4,147.0 363.8,149.4 313.1,156.4 264.2,182.4 244.8,234.5 229.2,290.3 237.8,353.9 287.7,394.8 347.0,413.1 411.9,424.5 481.5,405.6 520.1,344.5 525.3,276.1 523.3,209.2 492.2,145.8"/>

      <!-- sweep afterglow + line -->
      <line x1="370" y1="268" x2="508" y2="130" stroke="#45e0ff" stroke-opacity="0.14" stroke-width="2"/>
      <line x1="370" y1="268" x2="500" y2="138" stroke="#45e0ff" stroke-opacity="0.24" stroke-width="2"/>
      <line x1="370" y1="268" x2="492.2" y2="145.8" stroke="#45e0ff" stroke-width="2" filter="url(#glow)"/>
      <circle cx="492.2" cy="145.8" r="3.4" fill="#c9f5ff" filter="url(#glow)"/>
      <circle cx="370" cy="268" r="3" fill="#45e0ff" fill-opacity="0.6"/>

      <!-- stereo goniometer inset -->
      <g>
        <circle cx="232" cy="402" r="76" fill="#080c10" stroke="#2a353e" stroke-width="1.5"/>
        <line x1="156" y1="402" x2="308" y2="402" stroke="#1b252d" stroke-width="1"/>
        <line x1="232" y1="326" x2="232" y2="478" stroke="#1b252d" stroke-width="1"/>
        <text x="232" y="318" fill="#7d878e" font-size="9" text-anchor="middle">STEREO</text>
        <polyline fill="none" stroke="#45e0ff" stroke-opacity="0.8" stroke-width="1.4"
          points="285.0,421.0 281.4,435.9 271.7,438.9 257.1,428.8 239.3,409.3 220.7,387.3 203.4,370.4 189.7,364.6 181.3,372.0 179.1,390.0 183.6,412.2 194.0,430.8 209.2,439.2 227.2,434.6 245.8,418.5 262.7,396.5 275.8,376.5 283.4,365.5 284.6,367.3 279.3,381.4 268.2,402.7 252.5,423.7 234.2,437.2 215.7,438.2 199.2,426.5 186.8,406.1 180.0,384.3 179.7,368.8 185.9,364.9 197.8,374.1 213.9,393.1 232.3,415.3 250.7,432.7 266.7,439.4 278.5,432.9 284.4,415.5 283.8,393.3 276.8,374.2 264.2,364.9 247.7,368.7"/>
      </g>
    </g>

    <!-- Readout panel -->
    <g>
      <rect x="616" y="52" width="468" height="432" rx="12" fill="#0d1318" stroke="#2a353e" stroke-width="1.5"/>
      <g font-size="11" fill="#7d878e">
        <rect x="632" y="64" width="436" height="78" rx="9" fill="url(#cell)" stroke="#232c33"/>
        <text x="648" y="86">MOMENTARY</text>
        <text x="646" y="126" font-size="30" fill="#46e16e">−12.3 LUFS</text>
        <rect x="648" y="132" width="404" height="3" fill="#46e16e"/>

        <rect x="632" y="150" width="436" height="78" rx="9" fill="url(#cell)" stroke="#232c33"/>
        <text x="648" y="172">SHORT-TERM 3 s</text>
        <text x="646" y="212" font-size="30" fill="#46e16e">−13.1 LUFS</text>
        <rect x="648" y="218" width="404" height="3" fill="#46e16e"/>

        <rect x="632" y="236" width="436" height="78" rx="9" fill="url(#cell)" stroke="#232c33"/>
        <text x="648" y="258">INTEGRATED</text>
        <text x="646" y="298" font-size="30" fill="#46e16e">−14.2 LUFS</text>
        <rect x="648" y="304" width="404" height="3" fill="#46e16e"/>

        <rect x="632" y="322" width="436" height="78" rx="9" fill="url(#cell)" stroke="#232c33"/>
        <text x="648" y="344">TRUE PEAK dBTP</text>
        <text x="646" y="384" font-size="30" fill="#f0c83c">−0.4</text>
        <rect x="648" y="390" width="404" height="3" fill="#f0c83c"/>

        <rect x="632" y="408" width="436" height="78" rx="9" fill="url(#cell)" stroke="#232c33"/>
        <text x="648" y="430">LOUDNESS RANGE</text>
        <text x="646" y="470" font-size="30" fill="#d2d8dc">6.8 LU</text>
        <rect x="648" y="476" width="404" height="3" fill="#5cb8e0"/>
      </g>
    </g>
  </g>

  <!-- ============================ ANNOTATIONS ============================ -->
  <g font-family="Avenir Next, Helvetica Neue, sans-serif">
    <!-- leader lines -->
    <g stroke="#465058" stroke-width="1" fill="none">
      <path d="M1136,170 C1160,170 1160,150 1180,150"/>
      <path d="M560,358 C580,358 600,300 640,240"/>
      <path d="M505,496 C520,496 540,470 560,330"/>
      <path d="M516,236 C540,236 560,300 580,380"/>
      <path d="M256,492 C240,492 220,470 200,450"/>
      <path d="M900,360 C940,360 960,400 980,530"/>
    </g>
    <!-- annotation dots -->
    <g fill="#45e0ff">
      <circle cx="394" cy="142" r="3.5"/>
      <circle cx="535.6" cy="358" r="3.5" fill="#46e16e"/>
      <circle cx="481.5" cy="495.6" r="3.5"/>
      <circle cx="492.2" cy="235.8" r="3.5"/>
      <circle cx="232" cy="492" r="3.5"/>
      <circle cx="880" cy="360" r="3.5"/>
    </g>

    <!-- labels -->
    <g>
      <text x="1136" y="128" fill="#e8eef2" font-size="15" font-weight="700">RADAR SCOPE</text>
      <text x="1136" y="147" fill="#7d878e" font-size="12">polar loudness history — angle is</text>
      <text x="1136" y="163" fill="#7d878e" font-size="12">time, radius is LUFS (−60 … 0)</text>

      <text x="1136" y="203" fill="#e8eef2" font-size="15" font-weight="700">TARGET RING</text>
      <text x="1136" y="222" fill="#7d878e" font-size="12">green, dashed, at the delivery</text>
      <text x="1136" y="238" fill="#7d878e" font-size="12">target (−14 LUFS)</text>

      <text x="1136" y="278" fill="#e8eef2" font-size="15" font-weight="700">PHOSPHOR TRAIL</text>
      <text x="1136" y="297" fill="#7d878e" font-size="12">momentary loudness over the sweep</text>
      <text x="1136" y="313" fill="#7d878e" font-size="12">window, fading with age</text>

      <text x="1136" y="353" fill="#e8eef2" font-size="15" font-weight="700">ROTATING SWEEP</text>
      <text x="1136" y="372" fill="#7d878e" font-size="12">one revolution per window, with</text>
      <text x="1136" y="388" fill="#7d878e" font-size="12">a glowing head at the level now</text>

      <text x="1136" y="428" fill="#e8eef2" font-size="15" font-weight="700">STEREO GONIOMETER</text>
      <text x="1136" y="447" fill="#7d878e" font-size="12">mid/side stereo-field inset</text>

      <text x="1136" y="503" fill="#e8eef2" font-size="15" font-weight="700">READOUT PANEL</text>
      <text x="1136" y="522" fill="#7d878e" font-size="12">Momentary · Short-Term · Integrated</text>
      <text x="1136" y="538" fill="#7d878e" font-size="12">· True Peak · Loudness Range</text>
    </g>
  </g>
</svg>
